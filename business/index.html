<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="آلين للأعمال - إدارة الطلبات والمندوبين والمكتبات والمدرسين والمطابع">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#143B68">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="آلين للأعمال">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>آلين للأعمال</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f5f8fc; }
    body { overflow: hidden; font-family: Arial, sans-serif; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: #f5f8fc; color: #143B68; z-index: 9999;
    }
    #loading .logo {
      width: 86px; height: 86px; border-radius: 24px; background: #143B68; color: white;
      display: grid; place-items: center; font-size: 38px; font-weight: 800;
      box-shadow: 0 12px 32px rgba(20,59,104,.18);
    }
    #loading .title { font-size: 24px; font-weight: 800; }
    #loading .sub { font-size: 13px; opacity: .7; text-align: center; padding: 0 24px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">A</div>
    <div class="title">آلين للأعمال</div>
    <div class="sub">جاري تشغيل النظام...</div>
  </div>
  <script>
    (function () {
      var startedAt = Date.now();
      var stopped = false;
      var observer;
      var timer;

      function loadingNode() {
        return document.getElementById('loading');
      }

      function flutterMounted() {
        return !!document.querySelector('flutter-view, flt-glass-pane, flt-scene-host, [flt-renderer]');
      }

      function hideLoading() {
        if (stopped) return;
        stopped = true;
        if (observer) observer.disconnect();
        if (timer) clearInterval(timer);
        var loading = loadingNode();
        if (loading) loading.remove();
      }

      function showStartupError() {
        if (stopped || flutterMounted()) {
          if (flutterMounted()) hideLoading();
          return;
        }
        var sub = document.querySelector('#loading .sub');
        if (sub) sub.textContent = 'تعذر إكمال تشغيل النظام. حدّث الصفحة وحاول مرة ثانية.';
      }

      window.addEventListener('flutter-first-frame', hideLoading, { once: true });

      observer = new MutationObserver(function () {
        if (flutterMounted()) hideLoading();
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });

      timer = setInterval(function () {
        if (flutterMounted()) {
          hideLoading();
          return;
        }
        if (Date.now() - startedAt > 20000) {
          clearInterval(timer);
          timer = null;
          showStartupError();
        }
      }, 250);

      window.addEventListener('error', function (event) {
        if (!stopped && event && event.filename && /flutter_bootstrap|main\.dart|canvaskit/i.test(event.filename)) {
          showStartupError();
        }
      });
      window.addEventListener('unhandledrejection', function () {
        if (!stopped && Date.now() - startedAt > 3000) showStartupError();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
