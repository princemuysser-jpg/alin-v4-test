name: Apply ALIN v4.2 Stable Lock

on:
  push:
    paths:
      - ".github/workflows/apply-courier-hub-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alin-v42-stable-lock-proven-runner
  cancel-in-progress: false

jobs:
  stable-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate current behavior into authoritative sources
        run: python3 scripts/apply-stable-lock.py

      - name: Build all generated runtimes
        run: python3 scripts/build-runtime.py

      - name: Syntax validation
        run: |
          set -e
          node --check core/finance-runtime.js
          node --check modules/teacher/finance.js
          node --check modules/admin/finance-settlement-ui.js
          node --check modules/admin/courier-hub.js
          node --check modules/admin/delivery-pricing.js
          node --check alin-config.js
          node --check dist/alin-core.v4.js
          node --check dist/alin-role-runtime.v4.js
          node --check alin-app-desktop.v4.2.0.js
          node --check alin-app-mobile.v4.2.0.js
          node --check alin-app-tablet.v4.2.0.js

      - name: Stable financial and routing smoke tests
        run: node scripts/stable-lock-smoke.js

      - name: Verify protected invariants
        run: |
          set -e
          grep -F "modules/admin/finance-settlement-ui.js" scripts/build-runtime.py
          grep -F "modules/admin/courier-hub.js" scripts/build-runtime.py
          grep -F "const rawCourierFee=order?.courier_fee;" core/finance-runtime.js
          grep -F "function teacherOrderDeliveryInfo(order)" modules/teacher/finance.js
          grep -F "ALIN v4.2 stable-lock smoke tests passed" scripts/stable-lock-smoke.js
          ! grep -F "loadTeacherOrderDeliveryFix" alin-config.js
          ! grep -F "loadAlinCourierAdminHub" alin-config.js
          ! grep -F "installCourierFeeDisplayCompatibility" alin-config.js
          ! grep -F "installDeliveryPricingUiBridge" alin-config.js
          ! grep -F 'data-admin-tab="courierAreas"' store-desktop.html
          ! grep -F 'data-admin-tab="deliveryOrders"' store-desktop.html
          ! grep -F 'data-admin-tab="courierSettlements"' store-desktop.html
          ! grep -F 'data-admin-tab="courierAreas"' store-mobile.html
          ! grep -F 'data-admin-tab="deliveryOrders"' store-mobile.html
          ! grep -F 'data-admin-tab="courierSettlements"' store-mobile.html
          ! grep -F 'data-admin-tab="courierAreas"' store-tablet.html
          ! grep -F 'data-admin-tab="deliveryOrders"' store-tablet.html
          ! grep -F 'data-admin-tab="courierSettlements"' store-tablet.html

      - name: Deterministic rebuild check
        run: |
          sha256sum dist/alin-core.v4.js dist/alin-role-runtime.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js > /tmp/first.sha
          python3 scripts/build-runtime.py
          sha256sum dist/alin-core.v4.js dist/alin-role-runtime.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js > /tmp/second.sha
          diff -u /tmp/first.sha /tmp/second.sha
          node scripts/stable-lock-smoke.js
          git diff --check

      - name: Commit frozen stable baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: lock v4.2 stable baseline without behavior changes"
          git push origin HEAD:main

# stable-lock ref trigger 2026-08-25
