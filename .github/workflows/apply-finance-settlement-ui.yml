name: Apply safe finance settlement UI

on:
  push:
    paths:
      - ".github/workflows/apply-finance-settlement-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alin-finance-settlement-ui
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate finance settlement UI and bust caches
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import re, subprocess

          root=Path('.')
          build=root/'scripts/build-runtime.py'
          text=build.read_text(encoding='utf-8')
          needle="'modules/admin/accounts-advanced.js','modules/admin/finance.js',"
          replacement="'modules/admin/accounts-advanced.js','modules/admin/finance.js','modules/admin/finance-settlement-ui.js',"
          if needle in text:
              text=text.replace(needle,replacement,1)
              build.write_text(text,encoding='utf-8')
          elif "'modules/admin/finance-settlement-ui.js'" not in text:
              raise SystemExit('Could not add finance settlement UI to role runtime')

          subprocess.run(['python3','scripts/build-runtime.py'],check=True)

          stamp=datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S')
          token=f'4.2.0-finance-settlement-ui-{stamp}'
          config=root/'alin-config.js'
          cfg=config.read_text(encoding='utf-8')
          cfg,count=re.subn(r"assetVersion:'[^']+'",f"assetVersion:'{token}'",cfg,count=1)
          if count!=1: raise SystemExit('Could not bump assetVersion')
          config.write_text(cfg,encoding='utf-8')

          for name in ('store-desktop.html','store-mobile.html','store-tablet.html'):
              path=root/name
              page=path.read_text(encoding='utf-8')
              page=re.sub(r'\?v=[A-Za-z0-9._:-]+',f'?v={token}',page)
              path.write_text(page,encoding='utf-8')

          print('asset token',token)

      - name: Validate settlement UI runtime
        run: |
          node --check modules/admin/finance-settlement-ui.js
          node --check dist/alin-role-runtime.v4.js
          grep -F "ALIN_FINANCE_SETTLEMENT_UI" dist/alin-role-runtime.v4.js
          grep -F "modules/admin/finance-settlement-ui.js" scripts/build-runtime.py
          grep -F "AlinFinanceSettlementUI.open" dist/alin-role-runtime.v4.js

      - name: Commit integrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-runtime.py modules/admin/finance-settlement-ui.js styles/alin-finance-settlement-ui.css dist/alin-role-runtime.v4.js dist/alin-core.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js alin-config.js store-desktop.html store-mobile.html store-tablet.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: replace finance prompts with safe settlement modal"
          git push origin HEAD:main
