name: Build Alin Flutter Android 5.6.1 Build 33 Signed

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-alin-flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: '5.6.1'
  BUILD_NUMBER: '33'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Persist checkout total display fix
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter_app/lib/screens/checkout_screen.dart')
          s = p.read_text()

          old = "  bool busy = false;\n  String? error;\n"
          new = "  bool busy = false;\n  String? error;\n  num? submittedFinalTotal;\n"
          if 'num? submittedFinalTotal;' not in s:
              if old not in s:
                  raise SystemExit('state fields anchor not found')
              s = s.replace(old, new, 1)

          old = "    setState(() { busy = true; error = null; });\n    try {\n"
          new = """    final submittedAfterDiscount = _quoteNumber('total', c.cartTotal);
    final submittedDeliveryFee = fulfillmentType == 'home_delivery' ? (area?.deliveryFee ?? 0) : 0;
    final submittedTotal = submittedAfterDiscount + submittedDeliveryFee;
    setState(() {
      busy = true;
      error = null;
      submittedFinalTotal = submittedTotal;
    });
    try {
"""
          if 'submittedFinalTotal = submittedTotal;' not in s:
              if old not in s:
                  raise SystemExit('submit anchor not found')
              s = s.replace(old, new, 1)

          old = "                      final finalTotal = afterDiscount + deliveryFee;\n"
          new = "                      final finalTotal = busy && submittedFinalTotal != null\n                          ? submittedFinalTotal!\n                          : afterDiscount + deliveryFee;\n"
          if 'busy && submittedFinalTotal != null' not in s:
              if old not in s:
                  raise SystemExit('total anchor not found')
              s = s.replace(old, new, 1)

          old = "    } finally {\n      if (mounted) setState(() => busy = false);\n    }\n"
          new = """    } finally {
      if (mounted) {
        setState(() {
          busy = false;
          submittedFinalTotal = null;
        });
      }
    }
"""
          if 'submittedFinalTotal = null;' not in s:
              if old not in s:
                  raise SystemExit('finally anchor not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git diff --check
          if ! git diff --quiet -- flutter_app/lib/screens/checkout_screen.dart; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add flutter_app/lib/screens/checkout_screen.dart
            git commit -m 'fix: keep checkout total stable after order creation [skip ci]'
            git push origin HEAD:main
          else
            echo 'Checkout total fix already persisted.'
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore fixed Android release signing key
        env:
          ALIN_KEYSTORE_BASE64: ${{ secrets.ALIN_KEYSTORE_BASE64 }}
          ALIN_KEYSTORE_PASSWORD: ${{ secrets.ALIN_KEYSTORE_PASSWORD }}
          ALIN_KEY_ALIAS: ${{ secrets.ALIN_KEY_ALIAS }}
          ALIN_KEY_PASSWORD: ${{ secrets.ALIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ALIN_KEYSTORE_BASE64 ALIN_KEYSTORE_PASSWORD ALIN_KEY_ALIAS ALIN_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ALIN_KEYSTORE_BASE64" | base64 --decode > android/app/alin-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ALIN_KEYSTORE_PASSWORD
          keyPassword=$ALIN_KEY_PASSWORD
          keyAlias=$ALIN_KEY_ALIAS
          keyPassword=$ALIN_KEY_PASSWORD
          storeFile=alin-release.jks
          EOF
          keytool -list -keystore android/app/alin-release.jks \
            -storepass "$ALIN_KEYSTORE_PASSWORD" \
            -alias "$ALIN_KEY_ALIAS" >/dev/null
          echo "Fixed Android release signing key restored successfully."

      - name: Install Flutter 3.44.9 stable
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - name: Prepare Android SDK
        working-directory: ${{ github.workspace }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build signed release AAB
        run: flutter build appbundle --release --no-pub --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"

      - name: Build signed release APK
        run: flutter build apk --release --no-pub --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"

      - name: Verify APK signing
        run: |
          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alin-flutter-v5.6.1-build33-ANDROID-SIGNED
          if-no-files-found: error
          path: |
            flutter_app/build/app/outputs/bundle/release/*.aab
            flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Remove signing files from runner
        if: always()
        run: |
          rm -f android/key.properties android/app/alin-release.jks
