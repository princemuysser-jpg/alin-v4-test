name: Build Alin Flutter Android

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-alin-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.44.9 stable
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - name: Prepare Android SDK
        working-directory: ${{ github.workspace }}
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build unsigned release AAB
        run: flutter build appbundle --release --no-pub

      - name: Build unsigned release APK
        run: flutter build apk --release --no-pub

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alin-flutter-android-unsigned
          if-no-files-found: error
          path: |
            flutter_app/build/app/outputs/bundle/release/*.aab
            flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
