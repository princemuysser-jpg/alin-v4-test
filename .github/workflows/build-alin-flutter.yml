name: Build Alin Flutter Android UI18

on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-alin-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.44.9 stable
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - name: Prepare Android SDK
        working-directory: ${{ github.workspace }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Build unsigned release AAB
        run: flutter build appbundle --release --no-pub

      - name: Build unsigned release APK
        run: flutter build apk --release --no-pub

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alin-flutter-ui18-v5.1.0-build3
          if-no-files-found: error
          path: |
            flutter_app/build/app/outputs/bundle/release/*.aab
            flutter_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
