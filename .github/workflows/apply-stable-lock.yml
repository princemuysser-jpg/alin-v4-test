name: Apply v4.2 Stable Lock

on:
  push:
    paths:
      - ".github/workflows/apply-stable-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alin-v42-stable-lock
  cancel-in-progress: false

jobs:
  stable-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Consolidate authoritative sources without changing behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          root=Path('.')

          # 1) Teacher orders: move the already-live delivery label correction
          # into the authoritative teacher renderer, eliminating the DOM patch.
          p=root/'modules/teacher/finance.js'
          text=p.read_text(encoding='utf-8')
          anchor="  function statusGroup(value){const key=String(value||'').toLowerCase();return done.has(key)?'done':cancelled.has(key)?'cancelled':'active'}\n"
          helper="""  function statusGroup(value){const key=String(value||'').toLowerCase();return done.has(key)?'done':cancelled.has(key)?'cancelled':'active'}
  function teacherOrderDeliveryInfo(order){
    const fulfillment=String(order?.fulfillment_type||'').toLowerCase();
    const deliveryType=String(order?.delivery_type||'').toLowerCase();
    const courierId=order?.courier_id||order?.delegate_id||'';
    const byCourier=fulfillment==='home_delivery'||deliveryType==='courier'||Boolean(courierId);
    if(byCourier){
      const couriers=arr(window.db?.accounts?.couriers||window.db?.couriers);
      const courier=couriers.find(row=>same(row.id,courierId));
      return {kind:'courier',label:courier?.name?`التوصيل: مندوب — ${courier.name}`:'التوصيل: مندوب'};
    }
    const libraries=arr(window.db?.accounts?.libraries);
    const library=libraries.find(row=>same(row.id,order?.library_id));
    return {kind:'library',label:`الاستلام: مكتبة — ${library?.name||'-'}`};
  }
"""
          if 'function teacherOrderDeliveryInfo(order)' not in text:
              if anchor not in text: raise SystemExit('teacher statusGroup anchor missing')
              text=text.replace(anchor,helper,1)

          old="""    const libraries=arr(window.db?.accounts?.libraries);
    const cards=d.orders.slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).map(order=>{
      const book=d.books.find(row=>same(row.id,order.item_id||order.booklet_id));
      const library=libraries.find(row=>same(row.id,order.library_id));
      const group=statusGroup(order.status);
      return `<article class=\"teacher-v154-order\" data-search=\"${escv(`${order.order_number||order.id} ${order.title||book?.title||''}`.toLowerCase())}\" data-status=\"${group}\" data-library=\"${escv(order.library_id||'')}\" data-date=\"${escv(dateOnly(order.created_at))}\"><div><h4>${escv(order.order_number||order.id)} — ${escv(order.title||book?.title||'ملزمة')}</h4><small>النسخ: ${Number(order.qty)||1} • المكتبة: ${escv(library?.name||'-')} • ${dateOnly(order.created_at)}</small></div><div class=\"teacher-v154-order-side\"><span class=\"teacher-v154-status ${group}\">${escv(statusText(order.status))}</span><b>${moneyv(order.total)} د.ع</b></div></article>`;
    }).join('')||'<div class=\"teacher-v154-empty\">لا توجد طلبات مرتبطة بملازمك.</div>';
"""
          new="""    const cards=d.orders.slice().sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))).map(order=>{
      const book=d.books.find(row=>same(row.id,order.item_id||order.booklet_id));
      const group=statusGroup(order.status);
      const delivery=teacherOrderDeliveryInfo(order);
      return `<article class=\"teacher-v154-order\" data-search=\"${escv(`${order.order_number||order.id} ${order.title||book?.title||''}`.toLowerCase())}\" data-status=\"${group}\" data-delivery=\"${delivery.kind}\" data-date=\"${escv(dateOnly(order.created_at))}\"><div><h4>${escv(order.order_number||order.id)} — ${escv(order.title||book?.title||'ملزمة')}</h4><small>النسخ: ${Number(order.qty)||1} • ${escv(delivery.label)} • ${dateOnly(order.created_at)}</small></div><div class=\"teacher-v154-order-side\"><span class=\"teacher-v154-status ${group}\">${escv(statusText(order.status))}</span><b>${moneyv(order.total)} د.ع</b></div></article>`;
    }).join('')||'<div class=\"teacher-v154-empty\">لا توجد طلبات مرتبطة بملازمك.</div>';
"""
          if old in text:
              text=text.replace(old,new,1)
          elif 'const delivery=teacherOrderDeliveryInfo(order);' not in text:
              raise SystemExit('teacher order render block missing')
          p.write_text(text,encoding='utf-8')

          # 2) Finance: move the existing courier_fee compatibility into shares()
          # exactly, so the config no longer wraps finance at runtime.
          p=root/'core/finance-runtime.js'
          text=p.read_text(encoding='utf-8')
          old="""    const delegate=delivery==='delegate'?Math.min(deliveryFee,Math.max(0,Math.round(deliveryFee*rate.delegate/100))):0;
    const admin=Math.max(0,total-teacher-library-delegate);
    const collectorId=delivery==='library'?(order?.library_id||order?.pickup_library_id||order?.assigned_library_id||''):(order?.delegate_id||order?.courier_id||'');
    const collectorProfit=delivery==='library'?library:delegate;
"""
          new="""    const calculatedDelegate=delivery==='delegate'?Math.min(deliveryFee,Math.max(0,Math.round(deliveryFee*rate.delegate/100))):0;
    const rawCourierFee=order?.courier_fee;
    const hasCourierFee=rawCourierFee!==null&&rawCourierFee!==undefined&&String(rawCourierFee).trim()!=='';
    const parsedCourierFee=hasCourierFee?Number(rawCourierFee):NaN;
    const delegate=delivery==='delegate'&&hasCourierFee&&Number.isFinite(parsedCourierFee)?Math.max(0,Math.round(parsedCourierFee)):calculatedDelegate;
    const admin=Math.max(0,total-teacher-library-delegate);
    const collectorId=delivery==='library'?(order?.library_id||order?.pickup_library_id||order?.assigned_library_id||''):(order?.delegate_id||order?.courier_id||'');
    const collectorProfit=delivery==='library'?library:delegate;
"""
          if old in text:
              text=text.replace(old,new,1)
          elif 'const rawCourierFee=order?.courier_fee;' not in text:
              raise SystemExit('finance delegate formula anchor missing')
          p.write_text(text,encoding='utf-8')

          # 3) Config keeps only true bootstrap responsibilities.
          p=root/'alin-config.js'
          text=p.read_text(encoding='utf-8')
          markers=[
            '/* One admin courier hub: couriers + areas + delivery orders + settlements. */',
            '/* Teacher orders: show the real delivery method (courier/library) in the orders tab. */',
            '/* ALIN v4.3.0 courier-fee compatibility. */',
            '/* ALIN v4.3.0 delivery pricing UI bridge. */',
          ]
          for marker in markers:
              if marker not in text: continue
              start=text.index(marker)
              end=text.find('\n})();',start)
              if end<0: raise SystemExit(f'config block end missing: {marker}')
              end += len('\n})();')
              while end < len(text) and text[end] in '\r\n': end += 1
              text=text[:start]+text[end:]
          p.write_text(text,encoding='utf-8')

          # The old teacher DOM correction is now fully authoritative.
          obsolete=root/'modules/teacher/order-delivery-label-fix.js'
          if obsolete.exists(): obsolete.unlink()

          # Stable lock documentation: no features, only fixes after this point.
          (root/'STABLE_LOCK.md').write_text('''# ALIN v4.2 Stable Lock\n\nThis baseline is feature-frozen.\n\nAllowed changes:\n- verified bug fixes\n- security fixes\n- performance fixes that preserve behavior\n- responsive/UI corrections that do not change financial or order semantics\n\nProtected invariants:\n- student delivery fee and courier fee remain independent\n- persisted `courier_fee` is authoritative for courier earnings when present\n- settlement history is append-only; balances are derived from ledger/settlements\n- teacher/library/courier/admin role behavior must remain available on desktop, tablet and mobile\n- generated runtimes must be rebuilt from authoritative source modules\n\nNo new feature should be merged while the stable lock is active.\n''',encoding='utf-8')

      - name: Add stable smoke tests
        shell: bash
        run: |
          cat > scripts/stable-lock-smoke.js <<'EOF'
          'use strict';
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');

          global.window={};
          window.window=window;
          window.current={role:'admin',id:'admin'};
          window.db={
            settings:{teacher_profit_percent:50,library_profit_percent:30,delegate_profit_percent:30},
            booklets:[{id:'B1',teacher_id:'T1',teacher_share_percent:50,library_share_percent:30}],
            orders:[],ledger:[],settlements:[],withdrawals:[],accounts:{teachers:[],libraries:[],couriers:[]},couriers:[]
          };
          vm.runInThisContext(fs.readFileSync('core/finance-runtime.js','utf8'),{filename:'core/finance-runtime.js'});
          assert(window.AlinFinance,'finance runtime did not install');

          const courierOrder={id:'O1',kind:'booklet',item_id:'B1',total:6000,delivery_fee:2000,courier_fee:1500,fulfillment_type:'home_delivery',courier_id:'C1'};
          const courierSplit=window.AlinFinance.shares(courierOrder);
          assert.strictEqual(courierSplit.delivery,'delegate');
          assert.strictEqual(courierSplit.deliveryFee,2000);
          assert.strictEqual(courierSplit.delegate,1500,'persisted courier_fee must stay authoritative');
          assert.strictEqual(courierSplit.merchandise,4000);
          assert.strictEqual(courierSplit.teacher,2000);
          assert.strictEqual(courierSplit.library,0);
          assert.strictEqual(courierSplit.admin,2500);
          assert.strictEqual(courierSplit.debt,4500);

          const calculatedOrder={...courierOrder,id:'O2'};delete calculatedOrder.courier_fee;
          const calculatedSplit=window.AlinFinance.shares(calculatedOrder);
          assert.strictEqual(calculatedSplit.delegate,600,'without persisted courier_fee the configured percentage remains the fallback');

          const libraryOrder={id:'O3',kind:'booklet',item_id:'B1',total:4000,delivery_fee:0,fulfillment_type:'library',library_id:'L1'};
          const librarySplit=window.AlinFinance.shares(libraryOrder);
          assert.strictEqual(librarySplit.delivery,'library');
          assert.strictEqual(librarySplit.teacher,2000);
          assert.strictEqual(librarySplit.library,1200);
          assert.strictEqual(librarySplit.delegate,0);
          assert.strictEqual(librarySplit.admin,800);

          const teacherSource=fs.readFileSync('modules/teacher/finance.js','utf8');
          assert(teacherSource.includes('function teacherOrderDeliveryInfo(order)'));
          assert(teacherSource.includes('التوصيل: مندوب'));
          assert(teacherSource.includes('الاستلام: مكتبة'));
          assert(!teacherSource.includes('• المكتبة: ${escv(library?.name'));

          const config=fs.readFileSync('alin-config.js','utf8');
          for(const forbidden of ['loadAlinCourierAdminHub','loadTeacherOrderDeliveryFix','installCourierFeeDisplayCompatibility','installDeliveryPricingUiBridge']){
            assert(!config.includes(forbidden),`duplicate runtime loader remains: ${forbidden}`);
          }
          console.log('ALIN v4.2 stable-lock smoke tests passed');
          EOF

          cat > .github/workflows/stable-lock-check.yml <<'EOF'
          name: ALIN v4.2 Stable Lock Check
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
          permissions:
            contents: read
          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Syntax check authoritative JavaScript
                  run: |
                    node --check core/finance-runtime.js
                    node --check modules/teacher/finance.js
                    node --check modules/admin/finance-settlement-ui.js
                    node --check modules/admin/courier-hub.js
                    node --check modules/admin/delivery-pricing.js
                    node --check alin-config.js
                - name: Stable financial and routing smoke tests
                  run: node scripts/stable-lock-smoke.js
                - name: Rebuild runtimes deterministically
                  run: |
                    python3 scripts/build-runtime.py
                    sha256sum dist/alin-core.v4.js dist/alin-role-runtime.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js > /tmp/first.sha
                    python3 scripts/build-runtime.py
                    sha256sum dist/alin-core.v4.js dist/alin-role-runtime.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js > /tmp/second.sha
                    diff -u /tmp/first.sha /tmp/second.sha
                - name: Verify generated runtime matches repository
                  run: git diff --exit-code -- dist/alin-core.v4.js dist/alin-role-runtime.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js
                - name: Verify stable-lock invariants
                  run: |
                    grep -F "modules/admin/finance-settlement-ui.js" scripts/build-runtime.py
                    grep -F "modules/admin/courier-hub.js" scripts/build-runtime.py
                    grep -F "const rawCourierFee=order?.courier_fee;" core/finance-runtime.js
                    grep -F "function teacherOrderDeliveryInfo(order)" modules/teacher/finance.js
                    ! grep -F "loadTeacherOrderDeliveryFix" alin-config.js
                    ! grep -F "loadAlinCourierAdminHub" alin-config.js
                    ! grep -F "installCourierFeeDisplayCompatibility" alin-config.js
                    ! grep -F "installDeliveryPricingUiBridge" alin-config.js
                    ! grep -F 'data-admin-tab="courierAreas"' store-desktop.html
                    ! grep -F 'data-admin-tab="deliveryOrders"' store-desktop.html
                    ! grep -F 'data-admin-tab="courierSettlements"' store-desktop.html
          EOF

      - name: Rebuild authoritative runtimes
        run: python3 scripts/build-runtime.py

      - name: Validate stable lock before commit
        run: |
          set -e
          node --check core/finance-runtime.js
          node --check modules/teacher/finance.js
          node --check modules/admin/finance-settlement-ui.js
          node --check modules/admin/courier-hub.js
          node --check modules/admin/delivery-pricing.js
          node --check alin-config.js
          node --check dist/alin-role-runtime.v4.js
          node scripts/stable-lock-smoke.js
          grep -F "modules/admin/finance-settlement-ui.js" scripts/build-runtime.py
          grep -F "modules/admin/courier-hub.js" scripts/build-runtime.py
          ! grep -F "loadTeacherOrderDeliveryFix" alin-config.js
          ! grep -F "loadAlinCourierAdminHub" alin-config.js
          ! grep -F "installCourierFeeDisplayCompatibility" alin-config.js
          ! grep -F "installDeliveryPricingUiBridge" alin-config.js

      - name: Bump cache token on all device entry pages
        shell: python
        run: |
          from pathlib import Path
          import re
          token='4.2.0-stable-lock-20260825'
          cfg=Path('alin-config.js')
          text=cfg.read_text(encoding='utf-8')
          text,n=re.subn(r"assetVersion:'[^']+'",f"assetVersion:'{token}'",text,count=1)
          if n!=1: raise SystemExit('assetVersion not found')
          cfg.write_text(text,encoding='utf-8')
          for name in ('store-desktop.html','store-mobile.html','store-tablet.html'):
            p=Path(name); page=p.read_text(encoding='utf-8')
            page=re.sub(r'\?v=[A-Za-z0-9._:-]+',f'?v={token}',page)
            p.write_text(page,encoding='utf-8')

      - name: Final rebuild and validation
        run: |
          python3 scripts/build-runtime.py
          node scripts/stable-lock-smoke.js
          node --check dist/alin-role-runtime.v4.js
          git diff --check

      - name: Commit stable lock baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: lock v4.2 stable baseline without behavior changes"
          git push origin HEAD:main
