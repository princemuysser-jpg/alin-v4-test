name: Sync printer role runtime

on:
  push:
    paths:
      - ".github/workflows/sync-printer-runtime.yml"
      - "modules/module-order.json"
      - "modules/admin/orders-grouped.js"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild staff runtime from authoritative sources
        shell: python
        run: |
          from pathlib import Path
          import json, re
          from datetime import datetime, timezone

          root=Path('.')
          order=json.loads((root/'modules/module-order.json').read_text(encoding='utf-8'))
          role_paths=order.get('role_runtime') or []
          required_sources=['modules/admin/accounts.js','modules/admin/orders-grouped.js']
          for required in required_sources:
              if required not in role_paths:
                  raise SystemExit(f'{required} missing from role runtime order')

          chunks=[]
          for rel in role_paths:
              path=root/rel
              if not path.is_file():
                  raise SystemExit(f'Missing runtime source: {rel}')
              chunks.append(f'/* {rel} */\n{path.read_text(encoding="utf-8").rstrip()}\n;\n')

          dist=root/'dist/alin-role-runtime.v4.js'
          dist.write_text('\n'.join(chunks),encoding='utf-8')
          text=dist.read_text(encoding='utf-8')
          required=[
              "printer:'مطبعة'",
              '<option value="printer">مطبعة</option>',
              'modules/admin/accounts.js',
              'modules/admin/orders-grouped.js',
              'عرض القائمة',
              'قائمة تجهيز الطلب',
          ]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Runtime markers missing: '+', '.join(missing))

          stamp=datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S')
          token=f'4.2.0-prep-list-{stamp}'
          cfg=root/'alin-config.js'
          config=cfg.read_text(encoding='utf-8')
          config,count=re.subn(r"assetVersion:'[^']+'",f"assetVersion:'{token}'",config,count=1)
          if count!=1:
              raise SystemExit('Could not update assetVersion')
          cfg.write_text(config,encoding='utf-8')

          for name in ('store-desktop.html','store-mobile.html','store-tablet.html'):
              path=root/name
              html=path.read_text(encoding='utf-8')
              html,count=re.subn(r'alin-config\.js\?v=[^\"]+',f'alin-config.js?v={token}',html,count=1)
              if count!=1:
                  raise SystemExit(f'Could not update config token in {name}')
              path.write_text(html,encoding='utf-8')

      - name: Validate runtime
        run: |
          node --check dist/alin-role-runtime.v4.js
          grep -F "printer:'مطبعة'" dist/alin-role-runtime.v4.js
          grep -F '<option value="printer">مطبعة</option>' dist/alin-role-runtime.v4.js
          grep -F 'modules/admin/orders-grouped.js' dist/alin-role-runtime.v4.js
          grep -F 'عرض القائمة' dist/alin-role-runtime.v4.js
          grep -F 'قائمة تجهيز الطلب' dist/alin-role-runtime.v4.js

      - name: Commit rebuilt runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/alin-role-runtime.v4.js alin-config.js store-desktop.html store-mobile.html store-tablet.html
          if git diff --cached --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git commit -m "fix: sync preparation list into role runtime"
          git push origin HEAD:main
