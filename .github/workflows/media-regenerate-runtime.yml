name: Regenerate media optimization runtimes

on:
  push:
    branches:
      - fix/optimize-media-egress-20261031
    paths:
      - core/storage.js
      - .github/workflows/media-regenerate-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/optimize-media-egress-20261031
          persist-credentials: true
      - name: Regenerate distribution bundles
        run: |
          set -euo pipefail
          python3 scripts/build-runtime.py
          node --check core/storage.js
          node --check dist/alin-core.v4.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alin-core.v4.js dist/alin-role-runtime.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(media): sync generated web runtimes'
            git push origin HEAD:fix/optimize-media-egress-20261031
          fi
