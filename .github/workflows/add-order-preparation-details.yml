name: Add order preparation details

on:
  push:
    paths:
      - ".github/workflows/add-order-preparation-details.yml"
      - "scripts/add-order-preparation-details.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alin-order-preparation-details
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply authoritative order preparation details
        run: python3 scripts/add-order-preparation-details.py
      - name: Validate source and protected behavior
        run: |
          set -e
          node --check modules/admin/orders.js
          grep -F 'function bookletPrep(o)' modules/admin/orders.js
          grep -F 'aria-label="بيانات التجهيز"' modules/admin/orders.js
          grep -F 'prep?.subject,prep?.term,prep?.teacher' modules/admin/orders.js
          node scripts/stable-current-smoke.js
          node scripts/report-finance-source-smoke.js
          node scripts/report-party-profit-smoke.js
      - name: Rebuild authoritative runtimes
        run: python3 scripts/build-runtime.py
      - name: Validate built runtime
        run: |
          set -e
          node --check dist/alin-role-runtime.v4.js
          grep -F 'aria-label="بيانات التجهيز"' dist/alin-role-runtime.v4.js
          grep -F 'function bookletPrep(o)' dist/alin-role-runtime.v4.js
          git diff --check
      - name: Commit stable display-only improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/admin/orders.js styles/alin-shared.css alin-config.js store-desktop.html store-mobile.html store-tablet.html dist/alin-role-runtime.v4.js dist/alin-core.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: show clear booklet preparation details in admin orders"
          git push origin HEAD:main
