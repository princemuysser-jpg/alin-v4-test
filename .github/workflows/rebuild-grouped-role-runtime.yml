name: Rebuild grouped role runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-grouped-role-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild role runtime
        run: python3 scripts/build-runtime.py

      - name: Verify grouped modules
        run: |
          grep -q 'modules/admin/orders-grouped.js' dist/alin-role-runtime.v4.js
          grep -q 'groupedOrderReceipts' dist/alin-role-runtime.v4.js
          node --check dist/alin-role-runtime.v4.js

      - name: Commit runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alin-role-runtime.v4.js dist/alin-core.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js
          if git diff --cached --quiet; then
            echo 'Runtime already current.'
            exit 0
          fi
          git commit -m 'build: restore grouped orders in role runtime'
          git push origin HEAD:main
