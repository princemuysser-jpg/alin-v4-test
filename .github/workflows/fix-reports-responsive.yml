name: Fix admin reports responsive layout

on:
  push:
    paths:
      - ".github/workflows/fix-reports-responsive.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alin-reports-responsive
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply responsive reports layout
        run: python3 scripts/fix-reports-responsive.py

      - name: Validate protected behavior
        run: |
          set -e
          grep -F 'canonical admin reports responsive layout' styles/alin-shared.css
          grep -F '#adminPage .admin-v143-table-wrap' styles/alin-shared.css
          grep -F '#adminPage .admin-v143-grid' styles/alin-shared.css
          node --check modules/admin/reports.js
          node scripts/stable-current-smoke.js
          node scripts/report-finance-source-smoke.js
          python3 scripts/build-runtime.py
          git diff --exit-code -- dist/alin-core.v4.js dist/alin-role-runtime.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js
          git diff --check

      - name: Commit responsive-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/alin-shared.css alin-config.js store-desktop.html store-mobile.html store-tablet.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: make admin reports responsive on mobile and tablet"
          git push origin HEAD:main
