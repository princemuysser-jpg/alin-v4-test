name: Validate student order notifications branch

on:
  push:
    branches:
      - fix/student-order-notifications-20260826
    paths:
      - '.github/workflows/test-student-notifications-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/student-order-notifications-20260826
          fetch-depth: 0

      - name: Syntax and regression checks
        run: |
          set -e
          node --check store/notifications.js
          node --check modules/admin/notifications.js
          node scripts/student-notifications-smoke.js
          node scripts/stable-current-smoke.js
          node scripts/report-finance-source-smoke.js

      - name: Build authoritative runtimes
        run: python3 scripts/build-runtime.py

      - name: Verify generated notification code
        run: |
          set -e
          node --check dist/alin-role-runtime.v4.js
          node --check alin-app-desktop.v4.2.0.js
          node --check alin-app-mobile.v4.2.0.js
          node --check alin-app-tablet.v4.2.0.js
          grep -F 'alin_student_notifications' alin-app-desktop.v4.2.0.js
          grep -F 'alin_student_notifications' alin-app-mobile.v4.2.0.js
          grep -F 'alin_student_notifications' alin-app-tablet.v4.2.0.js
          grep -F 'alin_admin_student_customers' dist/alin-role-runtime.v4.js
          git diff --check

      - name: Bump cache tokens
        shell: python
        run: |
          from pathlib import Path
          import re
          token='4.2.0-stable-student-order-notifications-20260826-0735'
          p=Path('alin-config.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"assetVersion:'[^']+'",f"assetVersion:'{token}'",s,count=1)
          if n!=1: raise SystemExit('assetVersion not found')
          p.write_text(s,encoding='utf-8')
          for name in ('store-desktop.html','store-mobile.html','store-tablet.html'):
            p=Path(name);s=p.read_text(encoding='utf-8')
            s=re.sub(r'\?v=[A-Za-z0-9._:-]+',f'?v={token}',s)
            p.write_text(s,encoding='utf-8')

      - name: Commit built branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/alin-core.v4.js dist/alin-role-runtime.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js alin-config.js store-desktop.html store-mobile.html store-tablet.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: student order notification runtime'
          git push origin HEAD:fix/student-order-notifications-20260826
