name: Add reports settlement lookup

on:
  push:
    paths:
      - ".github/workflows/add-reports-party-profit-selector.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source change
        run: python3 scripts/add-report-settlement-lookup.py
      - name: Validate source
        run: |
          node --check modules/admin/reports.js
          node scripts/report-finance-source-smoke.js
          grep -F "كشف حساب سريع للتسوية" modules/admin/reports.js
          grep -F "teacherSummary?.(state.partyId)" modules/admin/reports.js
          grep -F "librarySummary?.(state.partyId)" modules/admin/reports.js
          grep -F "delegateSummary?.(state.partyId)" modules/admin/reports.js
      - name: Build runtime
        run: python3 scripts/build-runtime.py
      - name: Validate runtime
        run: |
          node --check dist/alin-role-runtime.v4.js
          grep -F "كشف حساب سريع للتسوية" dist/alin-role-runtime.v4.js
          node scripts/stable-current-smoke.js
          git diff --check
      - name: Bust cache
        shell: python
        run: |
          from pathlib import Path
          import re
          token='4.2.0-stable-report-settlement-lookup-20260825-1440'
          cfg=Path('alin-config.js')
          text=cfg.read_text(encoding='utf-8')
          text,n=re.subn(r"assetVersion:'[^']+'",f"assetVersion:'{token}'",text,count=1)
          if n!=1: raise SystemExit('assetVersion not found')
          cfg.write_text(text,encoding='utf-8')
          for name in ('store-desktop.html','store-mobile.html','store-tablet.html'):
            p=Path(name)
            page=p.read_text(encoding='utf-8')
            page=re.sub(r'\?v=[A-Za-z0-9._:-]+',f'?v={token}',page)
            p.write_text(page,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/admin/reports.js dist/alin-role-runtime.v4.js dist/alin-core.v4.js alin-app-desktop.v4.2.0.js alin-app-mobile.v4.2.0.js alin-app-tablet.v4.2.0.js alin-config.js store-desktop.html store-mobile.html store-tablet.html
          git commit -m "feat: add quick settlement account lookup to reports"
          git push origin HEAD:main
