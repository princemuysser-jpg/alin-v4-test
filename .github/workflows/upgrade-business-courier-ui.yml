name: Upgrade ALIN Business Courier UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/upgrade_business_courier_ui.py'
      - '.github/workflows/upgrade-business-courier-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply courier UI refresh
        run: |
          python3 scripts/upgrade_business_courier_ui.py
          sed -i "/import '..\/widgets\/grouped_order_receipt_card.dart';/d" flutter_business/lib/screens/courier_dashboard_screen.dart

      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Analyze ALIN Business
        working-directory: flutter_business
        run: |
          flutter pub get
          flutter analyze lib

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_business
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: courier receipts print and refreshed business identity'
            git push
          fi
