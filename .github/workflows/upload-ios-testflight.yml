name: ALIN iOS TestFlight Upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-upload:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter_app

    env:
      IOS_BUNDLE_ID: com.alin.platform
      APPLE_TEAM_ID: VW9PHWNAGK
      PROVISIONING_PROFILE_NAME: Alin App Store
      P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter 3.44.9
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.44.9 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" --version

      - name: Verify secrets
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$PROFILE_BASE64"
          test -n "$ASC_KEY_BASE64"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Flutter checks
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze lib
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          fi

      - name: Prepare final ALIN iOS app icons
        run: |
          set -euo pipefail
          SOURCE_ICON="assets/images/alin_icon.png"
          ICON_DIR="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          FLAT_JPG="$RUNNER_TEMP/alin-icon-flat.jpg"
          test -s "$SOURCE_ICON"
          mkdir -p "$ICON_DIR"
          # Flatten any alpha channel first so App Store marketing icon is fully opaque.
          sips -s format jpeg "$SOURCE_ICON" --out "$FLAT_JPG" >/dev/null
          make_icon() {
            local size="$1"
            local file="$2"
            sips -z "$size" "$size" -s format png "$FLAT_JPG" --out "$ICON_DIR/$file" >/dev/null
            test "$(sips -g pixelWidth "$ICON_DIR/$file" | awk '/pixelWidth/ {print $2}')" = "$size"
            test "$(sips -g pixelHeight "$ICON_DIR/$file" | awk '/pixelHeight/ {print $2}')" = "$size"
          }
          make_icon 40 Icon-App-40.png
          make_icon 60 Icon-App-60.png
          make_icon 58 Icon-App-58.png
          make_icon 87 Icon-App-87.png
          make_icon 80 Icon-App-80.png
          make_icon 120 Icon-App-120.png
          make_icon 180 Icon-App-180.png
          make_icon 76 Icon-App-76.png
          make_icon 152 Icon-App-152.png
          make_icon 167 Icon-App-167.png
          make_icon 1024 Icon-App-1024.png
          sips -g hasAlpha "$ICON_DIR/Icon-App-1024.png" | grep -q 'hasAlpha: no'

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/alin_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/alin-signing.keychain-db"
          KEYCHAIN_PASSWORD="alin-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution:'
          echo "TEMP_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "TEMP_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/Alin_App_Store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/Alin_App_Store.plist"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          PROFILE_APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST")
          test "$PROFILE_NAME" = "$PROVISIONING_PROFILE_NAME"
          test "$PROFILE_TEAM" = "$APPLE_TEAM_ID"
          test "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.$IOS_BUNDLE_ID"
          test "$PROFILE_APS" = "production"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          ASC_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$ASC_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$ASC_KEY_DIR"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout
          test -s "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Prepare release
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((22 + GITHUB_RUN_NUMBER))
          echo "IOS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign --no-pub --build-number="$BUILD_NUMBER"

      - name: Archive signed app
        run: |
          set -euo pipefail
          mkdir -p build/ios/archive
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_PLIST" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key><string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          rm -rf build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$EXPORT_PLIST"
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Validate IPA
        run: |
          set -euo pipefail
          test -s "$ASC_KEY_PATH"
          xcrun altool \
            --validate-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          test -s "$ASC_KEY_PATH"
          xcrun altool \
            --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup
        if: always()
        run: |
          set +e
          if [ -n "${TEMP_KEYCHAIN_PATH:-}" ]; then
            security default-keychain -d user -s login.keychain-db
            security delete-keychain "$TEMP_KEYCHAIN_PATH"
          fi
          if [ -n "${PROVISIONING_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROVISIONING_PROFILE_UUID.mobileprovision"
          fi
          rm -f "${ASC_KEY_PATH:-/nonexistent}"
