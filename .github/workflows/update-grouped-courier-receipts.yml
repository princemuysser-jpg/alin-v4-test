name: Update grouped courier orders and receipts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-grouped-courier-receipts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch web and Flutter Business
        run: |
          python3 scripts/update_grouped_courier_receipts.py
          python3 scripts/build-runtime.py

      - name: Check web JavaScript
        run: |
          node --check modules/core/receipts-center.js
          node --check modules/courier/dashboard.js
          node --check dist/alin-role-runtime.v4.js

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Analyze Flutter Business
        working-directory: flutter_business
        run: |
          flutter pub get
          flutter analyze lib

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/core/receipts-center.js dist/alin-role-runtime.v4.js alin-config.js flutter_business/lib/screens/courier_dashboard_screen.dart flutter_business/lib/screens/admin_dashboard_screen.dart flutter_business/lib/screens/admin_desktop_dashboard_screen.dart flutter_business/lib/widgets/grouped_order_receipt_card.dart flutter_business/pubspec.yaml
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'feat: group courier materials and receipts by checkout'
          git push origin HEAD:main
