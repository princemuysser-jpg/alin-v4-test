name: Update grouped courier orders and receipts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-grouped-courier-receipts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch web and Flutter Business
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

