name: Apply Business Branding Parity

on:
  push:
    paths:
      - 'scripts/apply_business_branding_parity.py'
      - '.github/workflows/apply-business-branding-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Apply branding parity patch
        run: python scripts/apply_business_branding_parity.py

      - name: Format and verify Flutter
        working-directory: flutter_business
        run: |
          dart format lib/main.dart lib/widgets/business_brand.dart lib/screens/admin_branding_screen.dart lib/screens/business_role_tools_screen.dart
          flutter pub get
          flutter analyze lib --no-fatal-infos

      - name: Commit branding parity
        run: |
          if git diff --quiet; then
            echo 'No branding parity changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_business/lib/main.dart flutter_business/lib/widgets/business_brand.dart flutter_business/lib/screens/admin_branding_screen.dart flutter_business/lib/screens/business_role_tools_screen.dart
          git commit -m 'feat: add shared Flutter visual identity parity'
          git push origin HEAD:main
