name: Fix grouped courier admin UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-admin-grouped-courier-ui.yml'
      - 'scripts/fix_grouped_courier_admin_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/fix_grouped_courier_admin_ui.py

      - name: Check legacy JavaScript
        run: |
          node --check modules/courier/assignment.js
          node --check modules/admin/orders-grouped.js

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Analyze Business Flutter
        working-directory: flutter_business
        run: |
          flutter pub get
          flutter analyze lib

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/courier/assignment.js modules/admin/orders-grouped.js flutter_business/lib/data/business_repository.dart flutter_business/lib/screens/admin_dashboard_screen.dart flutter_business/pubspec.yaml
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'fix: group courier admin orders and assign by checkout'
          git push origin HEAD:main
