name: Fix courier checkout group assignment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-courier-group-assignment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin assignment paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patches = [
              (
                  Path('flutter_business/lib/data/business_repository.dart'),
                  "final raw = await client.rpc('alin_admin_assign_order', params: {",
                  "final raw = await client.rpc('alin_admin_assign_order_group', params: {",
              ),
              (
                  Path('modules/courier/core.js'),
                  "const result=await rpc('alin_admin_assign_order',{",
                  "const result=await rpc('alin_admin_assign_order_group',{",
              ),
          ]

          for path, old, new in patches:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 assignment call, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Guardrails: individual assignment must not remain in the two live admin paths.
          if "client.rpc('alin_admin_assign_order', params:" in Path('flutter_business/lib/data/business_repository.dart').read_text(encoding='utf-8'):
              raise SystemExit('Flutter admin still contains individual assignment RPC')
          if "rpc('alin_admin_assign_order',{\n      p_order_id" in Path('modules/courier/core.js').read_text(encoding='utf-8'):
              raise SystemExit('Legacy web admin still contains individual assignment RPC')
          PY

      - name: Check legacy JavaScript syntax
        run: node --check modules/courier/core.js

      - name: Commit grouped assignment fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- flutter_business/lib/data/business_repository.dart modules/courier/core.js; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_business/lib/data/business_repository.dart modules/courier/core.js
          git commit -m 'fix: assign whole checkout group to courier'
          git push origin HEAD:main
