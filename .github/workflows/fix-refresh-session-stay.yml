name: Fix ALIN refresh session stay

on:
  push:
    paths:
      - ".github/workflows/fix-refresh-session-stay.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alin-refresh-session-stay
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix authoritative auth boot and rebuild runtimes
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          root=Path('.')
          auth=root/'modules/core/auth-service.js'
          text=auth.read_text(encoding='utf-8')
          old="if(!c?.auth)return openPublicStore();"
          new="if(!c?.auth){finishAuthBoot();return false;}"
          if old not in text:
              if new not in text:
                  raise SystemExit('Expected auth restore line not found')
          else:
              text=text.replace(old,new,1)
              auth.write_text(text,encoding='utf-8')

          # Rebuild desktop/mobile/tablet public app bundles from authoritative sources.
          import subprocess
          subprocess.run(['python3','scripts/build-runtime.py'],check=True)

          stamp=datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S')
          token=f'4.2.0-refresh-session-stay-{stamp}'

          config=root/'alin-config.js'
          cfg=config.read_text(encoding='utf-8')
          cfg,count=re.subn(r"assetVersion:'[^']+'",f"assetVersion:'{token}'",cfg,count=1)
          if count!=1: raise SystemExit('Could not bump assetVersion')
          config.write_text(cfg,encoding='utf-8')

          # Bust all startup/runtime asset URLs on all three entry pages.
          for name in ('store-desktop.html','store-mobile.html','store-tablet.html'):
              path=root/name
              page=path.read_text(encoding='utf-8')
              page=re.sub(r'\?v=[A-Za-z0-9._:-]+',f'?v={token}',page)
              path.write_text(page,encoding='utf-8')

          print('token',token)

      - name: Validate rebuilt JavaScript
        run: |
          node --check modules/core/auth-service.js
          node --check alin-app-desktop.v4.2.0.js
          node --check alin-app-mobile.v4.2.0.js
          node --check alin-app-tablet.v4.2.0.js
          node --check core/csp-desktop-inline-1.js
          node --check core/csp-mobile-inline-1.js
          grep -F "if(!c?.auth){finishAuthBoot();return false;}" alin-app-desktop.v4.2.0.js
          grep -F "if(!c?.auth){finishAuthBoot();return false;}" alin-app-mobile.v4.2.0.js
          grep -F "if(!c?.auth){finishAuthBoot();return false;}" alin-app-tablet.v4.2.0.js

      - name: Commit rebuilt runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            modules/core/auth-service.js \
            dist/alin-core.v4.js \
            dist/alin-role-runtime.v4.js \
            alin-app-desktop.v4.2.0.js \
            alin-app-mobile.v4.2.0.js \
            alin-app-tablet.v4.2.0.js \
            alin-config.js \
            store-desktop.html \
            store-mobile.html \
            store-tablet.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: preserve staff session and page on refresh"
          git push origin HEAD:main
