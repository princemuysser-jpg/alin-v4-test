<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self' blob:;">
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<meta content="#f7fbff" name="theme-color"/>
<title>منصة آلين</title>
<link href="./styles/alin-splash.css?v=4.2.0-rc.16" rel="stylesheet"/>
<script src="./core/device-router.js?v=4.2.0-rc.16" defer></script>
<script src="./core/runtime-guard.js?v=4.2.0-rc.16" defer></script>
</head>
<body>
<main id="alinSplash" class="alin-splash" role="status" aria-live="polite" aria-label="جار فتح منصة آلين">
  <div class="alin-splash__decor alin-splash__decor--book" aria-hidden="true">▤</div>
  <div class="alin-splash__decor alin-splash__decor--pencil" aria-hidden="true">✎</div>
  <div class="alin-splash__decor alin-splash__decor--gift" aria-hidden="true">◇</div>
  <section class="alin-splash__content">
    <img class="alin-splash__mark" src="./assets/images/alin-splash-mark.webp" alt="" aria-hidden="true"/>
    <div class="alin-splash__latin" aria-hidden="true">ALIN</div>
    <div class="alin-splash__platform" aria-hidden="true"><span></span>PLATFORM<span></span></div>
    <h1>منصة آلين</h1>
    <p class="alin-splash__tagline">للملازم والقرطاسية والهدايا</p>

    <div class="alin-splash__loading" aria-hidden="true">
      <strong>جار فتح منصة آلين...</strong>
      <div class="alin-splash__progress"><i></i></div>
    </div>

    <div class="alin-splash__features" aria-hidden="true">
      <div><b class="alin-splash__feature-icon">▤</b><strong>ملازم</strong><small>المواد الدراسية</small></div>
      <div><b class="alin-splash__feature-icon">✎</b><strong>قرطاسية</strong><small>أدوات مدرسية</small></div>
      <div><b class="alin-splash__feature-icon">◇</b><strong>هدايا</strong><small>لكل مناسبة</small></div>
    </div>
  </section>
  <div class="alin-splash__wave" aria-hidden="true"></div>
  <span class="alin-splash__sr">جار فتح منصة آلين، يرجى الانتظار.</span>
</main>
<noscript style="display:block;padding:24px;color:#fff;background:#00143c;font-family:Tahoma,'Segoe UI',sans-serif;text-align:center">يلزم تشغيل JavaScript للدخول التلقائي. <a style="color:#35e5ff;margin:0 8px" href="./store-mobile.html">فتح واجهة الموبايل</a><a style="color:#35e5ff;margin:0 8px" href="./store-desktop.html">فتح واجهة الكمبيوتر</a></noscript>
<script src="./core/splash.js?v=4.2.0-rc.16" defer></script>
</body>
</html>
