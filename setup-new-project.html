<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; script-src-elem 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https:; object-src 'none'; base-uri 'self'; form-action 'self';">

<title>إعداد مشروع آلين الجديد</title>
<style>
body{font-family:system-ui;background:#f5f1e8;color:#172033;margin:0;padding:24px}.card{max-width:760px;margin:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 16px 50px #0001}h1{margin-top:0}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3dc;border-radius:10px;font:inherit}button{margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:#183c65;color:#fff;font:700 16px system-ui;cursor:pointer}.secondary{background:#5b6470}pre{white-space:pre-wrap;direction:ltr;text-align:left;background:#101827;color:#e8f1ff;padding:14px;border-radius:12px;overflow:auto}.ok{color:#087a43}.err{color:#b42318}small{display:block;line-height:1.7;color:#5b6470}</style>
</head>
<body><main class="card">
<h1>إعداد مشروع Supabase النظيف لمنصة آلين</h1>
<small>استخدم هذه الصفحة بعد تنفيذ ملف <b>ALIN_V4_CLEAN_PROJECT_MASTER.sql</b> ونشر Edge Function باسم <b>bootstrap-first-admin</b> وضبط السر <b>ALIN_BOOTSTRAP_KEY</b>.</small>
<label>Project URL</label><input id="url" placeholder="https://xxxxx.supabase.co">
<label>Anon Key</label><input id="key" placeholder="eyJ...">
<label>Bootstrap Key</label><input id="bootstrap" type="password" placeholder="المفتاح الذي وضعته في أسرار Edge Functions">
<label>اسم المدير</label><input id="name" value="مدير منصة آلين">
<label>اسم الدخول</label><input id="username" value="admin">
<label>كلمة المرور</label><input id="password" type="password" placeholder="12 حرفاً على الأقل مع حروف وأرقام">
<button id="create">إنشاء المدير الأول</button>
<button id="download" class="secondary">تنزيل ملف config.js للمشروع الجديد</button>
<p id="status"></p><pre id="preview"></pre>
</main>
<script src="./core/setup-new-project.js?v=4.2.0-rc.16" defer></script></body></html>
